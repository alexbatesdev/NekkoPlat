<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NekkoPlat - Minimal Camera Zone (Floors) Example</title>

    <!--
        Same import setup as ../minimal-import/: only css/global.css (structural) and
        js/platformer.js (engine) are required, plus this example's own object styling.

        A 2x2 grid: two "floors" (rows) of two screens each. Each floor has its own
        camera-zone (no-constrain-x) covering the solid ground on either side of a
        vertical shaft, so walking left/right across a floor scrolls the camera
        normally in X but the camera can never scroll up/down past that floor's
        boundary. The shaft (the gap in the middle with no camera-zone) is the one
        place with no Y constraint at all, so the camera follows the player normally
        while they climb/fall between floors. A ledge partway up the shaft lets you
        jump back up to the top floor after dropping down.
    -->
    <link rel="stylesheet" href="../../css/reset.css">
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="./minimal-camera-zone-floors.css">
    <script type="module" src="../../js/platformer.js" defer></script>
    <style>
        /* This level has no "initial"/"dynamic" class, so --screen-width/height fall back to
           global.css's 100vw/100vh; override the vh-based --player-spawn-y default here in px
           so it doesn't spawn the player below the floor. Spawn on the right side of the
           top-left screen's floor, clear of the shaft gap. */
        :root {
            --player-spawn-x: 500px;
            --player-spawn-y: 300px;
        }
    </style>
</head>

<body>
    <div id="viewport">
        <div class="level grid-2x2 contain" id="level-one">
            <div class="screen">
                <!-- width/height are required on the player element; the engine doesn't set them -->
                <div id="player" style="width: 50px; height: 50px; background: hotpink;">
                    <div id="interactionBox"></div>
                    <span class="config">
                        <span class="maxVelocity">10</span>
                        <span class="sprintMaxVelocity">18</span>
                        <span class="acceleration">1</span>
                        <span class="sprintAcceleration">2</span>
                        <span class="maxAirJumps">1</span>
                        <span class="gravity">0.9</span>
                        <span class="fallingGravity">3</span>
                        <span class="preJumpAllowance">10</span>
                        <span class="jumpForce">25</span>
                        <span class="coyoteTime">100</span>
                    </span>
                </div>
                <!-- Top floor, left screen: floor has a 200px gap (the shaft) between
                     150px and 350px. Two Y-locked zones flank the gap; the gap itself
                     has no camera-zone, so it's free to scroll vertically. -->
                <div class="object camera-zone no-constrain-x" style="left: 0; top: 0; width: 150px; height: 100%;"></div>
                <div class="object camera-zone no-constrain-x" style="left: 350px; top: 0; width: calc(100% - 350px); height: 100%;"></div>
                <div class="object solid floor" style="left: 0; width: 150px;"></div>
                <div class="object solid floor" style="left: 350px; width: calc(100% - 350px);"></div>
            </div>
            <div class="screen">
                <!-- Top floor, right screen: solid ground, no shaft here. -->
                <div class="object camera-zone no-constrain-x" style="left: 0; top: 0; width: 100%; height: 100%;"></div>
                <div class="object solid floor"></div>
            </div>
            <div class="screen">
                <!-- Bottom floor, left screen: same shaft x-range as the top-left screen so
                     the two floors' zones line up, plus a ledge to climb back up through it. -->
                <div class="object camera-zone no-constrain-x" style="left: 0; top: 0; width: 150px; height: 100%;"></div>
                <div class="object camera-zone no-constrain-x" style="left: 350px; top: 0; width: calc(100% - 350px); height: 100%;"></div>
                <div class="object solid floor room"></div>
                <div class="object solid ledge" style="left: 150px; width: 200px; bottom: 45%;"></div>
            </div>
            <div class="screen">
                <!-- Bottom floor, right screen: solid ground, no shaft here. -->
                <div class="object camera-zone no-constrain-x" style="left: 0; top: 0; width: 100%; height: 100%;"></div>
                <div class="object solid floor room"></div>
            </div>
        </div>
    </div>
</body>

</html>
