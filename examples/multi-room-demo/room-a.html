<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NekkoPlat - Multi-Room Demo (Room A)</title>

    <!--
        Same import setup as ../minimal-import/: only css/global.css (structural) and
        js/platformer.js (engine) are required, plus this example's own object styling.
        Rooms are separate pages linked via .door elements, the same way html/hub.html,
        html/grassland.html and html/platformer.html link to each other: a door's onclick
        navigates to "otherRoom.html#doorId", and the player spawns at the element with
        that id on the destination page.
    -->
    <link rel="stylesheet" href="../../css/reset.css">
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="./multi-room-demo.css">
    <script type="module" src="../../js/platformer.js" defer></script>
    <style>
        /* This level has no "initial"/"dynamic" class, so --screen-width/height fall back to
           global.css's 100vw/100vh; override the vh-based --player-spawn-y default here in px
           so it doesn't spawn the player below the floor when a room is opened directly
           (i.e. without a door's #id in the URL). */
        :root {
            --player-spawn-x: 300px;
            --player-spawn-y: 300px;
        }
    </style>
</head>

<body class="room-a">
    <div id="viewport">
        <div class="level grid-1x1 contain" id="level-one">
            <div class="screen">
                <!-- width/height are required on the player element; the engine doesn't set them -->
                <div id="player" style="width: 50px; height: 50px; background: hotpink;">
                    <div class="interaction-indicator question-indicator">?</div>
                    <div id="interactionBox"></div>
                    <span class="config">
                        <span class="maxVelocity">10</span>
                        <span class="sprintMaxVelocity">18</span>
                        <span class="acceleration">1</span>
                        <span class="sprintAcceleration">2</span>
                        <span class="maxAirJumps">1</span>
                        <span class="gravity">0.9</span>
                        <span class="fallingGravity">3</span>
                        <span class="preJumpAllowance">10</span>
                        <span class="jumpForce">25</span>
                        <span class="coyoteTime">100</span>
                    </span>
                </div>
                <div class="object solid floor" id="floor-1"></div>
                <div class="door object interactable clickable door-right" id="door-to-b"
                    onclick="window.location.href='./room-b.html#door-to-a'"></div>
            </div>
        </div>
    </div>
</body>

</html>
