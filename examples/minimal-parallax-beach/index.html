<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NekkoPlat - Minimal Parallax Beach Example</title>

    <!--
        Same import setup as ../minimal-import/: only css/global.css (structural) and
        js/platformer.js (engine) are required, plus this example's own object styling.

        The four ocean bands (.wave-back/.wave-mid/.wave-front/.wave-shore) are level-wide
        parallax layers (direct children of .level, class="parallax-layer") - same mechanism
        as ../minimal-parallax/'s sun, just four of them stacked at increasing depth so the
        ocean appears to have real distance as the camera scrolls between screens.

        Each wave's <path> "d" data was generated offline with a sine-based version of the
        smoothed-bezier algorithm from this "gradientwaves-svg" codepen (credit: supahfunk,
        https://codepen.io/supah/ - see the original interactive/randomized generator there),
        swapped from Math.random() to Math.sin() so the shoreline reads as rolling waves
        instead of jagged random peaks, and baked into a static path once instead of being
        regenerated live via dat.gui + chroma.js at runtime.
    -->
    <link rel="stylesheet" href="../../css/reset.css">
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="./minimal-parallax-beach.css">
    <script type="module" src="../../js/platformer.js" defer></script>
    <style>
        /* This level has no "initial"/"dynamic" class, so --screen-width/height fall back to
           global.css's 100vw/100vh; override the vh-based --player-spawn-y default here in px
           so it doesn't spawn the player below the floor. */
        :root {
            --player-spawn-x: 300px;
            --player-spawn-y: 300px;
        }
    </style>
</head>

<body>
    <div id="viewport">
        <div class="level grid-3x1 contain" id="level-one">
            <!-- Level-wide parallax layers, stacked far -> near. Each is oversized (width/left)
                 so its horizontal parallax drift never reveals an edge. -->
            <div class="parallax-layer sky-gradient noplax-x noplax-y" data-plax-depth="0.02"></div>

            <div class="parallax-layer wave-layer wave-back noplax-y" data-plax-depth="0.15"
                style="left: -50%; width: 200%; z-index: 2;">
                <svg viewBox="0 0 1200 400" preserveAspectRatio="none">
                    <path
                        d="M 0 400 L 0.0 195.5 C 33.3 195.5, 66.7 202.9, 100.0 202.9 C 133.3 202.9, 166.7 184.5, 200.0 184.5 C 233.3 184.5, 266.7 177.1, 300.0 177.1 C 333.3 177.1, 366.7 195.5, 400.0 195.5 C 433.3 195.5, 466.7 202.9, 500.0 202.9 C 533.3 202.9, 566.7 184.5, 600.0 184.5 C 633.3 184.5, 666.7 177.1, 700.0 177.1 C 733.3 177.1, 766.7 195.5, 800.0 195.5 C 833.3 195.5, 866.7 202.9, 900.0 202.9 C 933.3 202.9, 966.7 184.5, 1000.0 184.5 C 1033.3 184.5, 1066.7 177.1, 1100.0 177.1 C 1133.3 177.1, 1166.7 195.5, 1200.0 195.5 L 1200 400 Z" />
                </svg>
            </div>

            <div class="parallax-layer wave-layer wave-mid noplax-y" data-plax-depth="0.3"
                style="left: -60%; width: 220%; z-index: 4;">
                <svg viewBox="0 0 1200 400" preserveAspectRatio="none">
                    <path
                        d="M 0 400 L 0.0 260.0 C 25.0 260.0, 50.0 239.4, 75.0 239.4 C 100.0 239.4, 125.0 220.0, 150.0 220.0 C 175.0 220.0, 200.0 240.6, 225.0 240.6 C 250.0 240.6, 275.0 260.0, 300.0 260.0 C 325.0 260.0, 350.0 239.4, 375.0 239.4 C 400.0 239.4, 425.0 220.0, 450.0 220.0 C 475.0 220.0, 500.0 240.6, 525.0 240.6 C 550.0 240.6, 575.0 260.0, 600.0 260.0 C 625.0 260.0, 650.0 239.4, 675.0 239.4 C 700.0 239.4, 725.0 220.0, 750.0 220.0 C 775.0 220.0, 800.0 240.6, 825.0 240.6 C 850.0 240.6, 875.0 260.0, 900.0 260.0 C 925.0 260.0, 950.0 239.4, 975.0 239.4 C 1000.0 239.4, 1025.0 220.0, 1050.0 220.0 C 1075.0 220.0, 1100.0 240.6, 1125.0 240.6 C 1150.0 240.6, 1175.0 260.0, 1200.0 260.0 L 1200 400 Z" />
                </svg>
            </div>

            <div class="parallax-layer wave-layer wave-front noplax-y" data-plax-depth="0.5"
                style="left: -70%; width: 240%; z-index: 6;">
                <svg viewBox="0 0 1200 400" preserveAspectRatio="none">
                    <path
                        d="M 0 400 L 0.0 301.1 C 20.0 301.1, 40.0 274.0, 60.0 274.0 C 80.0 274.0, 100.0 298.9, 120.0 298.9 C 140.0 298.9, 160.0 326.0, 180.0 326.0 C 200.0 326.0, 220.0 301.1, 240.0 301.1 C 260.0 301.1, 280.0 274.0, 300.0 274.0 C 320.0 274.0, 340.0 298.9, 360.0 298.9 C 380.0 298.9, 400.0 326.0, 420.0 326.0 C 440.0 326.0, 460.0 301.1, 480.0 301.1 C 500.0 301.1, 520.0 274.0, 540.0 274.0 C 560.0 274.0, 580.0 298.9, 600.0 298.9 C 620.0 298.9, 640.0 326.0, 660.0 326.0 C 680.0 326.0, 700.0 301.1, 720.0 301.1 C 740.0 301.1, 760.0 274.0, 780.0 274.0 C 800.0 274.0, 820.0 298.9, 840.0 298.9 C 860.0 298.9, 880.0 326.0, 900.0 326.0 C 920.0 326.0, 940.0 301.1, 960.0 301.1 C 980.0 301.1, 1000.0 274.0, 1020.0 274.0 C 1040.0 274.0, 1060.0 298.9, 1080.0 298.9 C 1100.0 298.9, 1120.0 326.0, 1140.0 326.0 C 1160.0 326.0, 1180.0 301.1, 1200.0 301.1 L 1200 400 Z" />
                </svg>
            </div>

            <div class="parallax-layer wave-layer wave-shore noplax-y" data-plax-depth="0.75"
                style="left: -80%; width: 260%; z-index: 8;">
                <svg viewBox="0 0 1200 400" preserveAspectRatio="none">
                    <path
                        d="M 0 400 L 0.0 366.4 C 16.7 366.4, 33.3 342.5, 50.0 342.5 C 66.7 342.5, 83.3 333.6, 100.0 333.6 C 116.7 333.6, 133.3 357.5, 150.0 357.5 C 166.7 357.5, 183.3 366.4, 200.0 366.4 C 216.7 366.4, 233.3 342.5, 250.0 342.5 C 266.7 342.5, 283.3 333.6, 300.0 333.6 C 316.7 333.6, 333.3 357.5, 350.0 357.5 C 366.7 357.5, 383.3 366.4, 400.0 366.4 C 416.7 366.4, 433.3 342.5, 450.0 342.5 C 466.7 342.5, 483.3 333.6, 500.0 333.6 C 516.7 333.6, 533.3 357.5, 550.0 357.5 C 566.7 357.5, 583.3 366.4, 600.0 366.4 C 616.7 366.4, 633.3 342.5, 650.0 342.5 C 666.7 342.5, 683.3 333.6, 700.0 333.6 C 716.7 333.6, 733.3 357.5, 750.0 357.5 C 766.7 357.5, 783.3 366.4, 800.0 366.4 C 816.7 366.4, 833.3 342.5, 850.0 342.5 C 866.7 342.5, 883.3 333.6, 900.0 333.6 C 916.7 333.6, 933.3 357.5, 950.0 357.5 C 966.7 357.5, 983.3 366.4, 1000.0 366.4 C 1016.7 366.4, 1033.3 342.5, 1050.0 342.5 C 1066.7 342.5, 1083.3 333.6, 1100.0 333.6 C 1116.7 333.6, 1133.3 357.5, 1150.0 357.5 C 1166.7 357.5, 1183.3 366.4, 1200.0 366.4 L 1200 400 Z" />
                </svg>
            </div>

            <div class="screen">
                <!-- width/height are required on the player element; the engine doesn't set them -->
                <div id="player" style="width: 50px; height: 50px; background: hotpink;">
                    <div id="interactionBox"></div>
                    <span class="config">
                        <span class="maxVelocity">10</span>
                        <span class="sprintMaxVelocity">18</span>
                        <span class="acceleration">1</span>
                        <span class="sprintAcceleration">2</span>
                        <span class="maxAirJumps">1</span>
                        <span class="gravity">0.9</span>
                        <span class="fallingGravity">3</span>
                        <span class="preJumpAllowance">10</span>
                        <span class="jumpForce">25</span>
                        <span class="coyoteTime">100</span>
                    </span>
                </div>
                <div class="object solid floor" id="floor-1"></div>
                <div class="object plax palm-tree z-3" style="left: 500px;"></div>
            </div>
            <div class="screen">
                <div class="object solid floor" id="floor-2"></div>
                <div class="object plax palm-tree z-3" style="left: 250px;"></div>
            </div>
            <div class="screen">
                <div class="object solid floor" id="floor-3"></div>
                <div class="object plax palm-tree z-3" style="left: 250px;"></div>
            </div>
        </div>
    </div>
</body>

</html>
