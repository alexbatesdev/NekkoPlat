<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planet Piinro - Star Isle Port</title>
    <link rel="stylesheet" href="../../../css/reset.css" />
    <link rel="stylesheet" href="../../../css/global.css" />
    <link rel="stylesheet" href="../planet-piinro.css" />
      <link rel="stylesheet" href="./room-3-star-isle-port.css" />
    <script type="module" src="../../../js/platformer.js" defer></script>
  </head>
  <body>
    <div id="viewport">
      <div class="level grid-1x1 contain" id="level-one">
        <div class="screen">
          <div class="room-number">Room 3</div>
          <h1 class="room-title">Star Isle Port</h1>
          <div
            id="player"
            style="width: 50px; height: 50px; background: hotpink"
          >
            <div class="interaction-indicator question-indicator">?</div>
            <div id="interactionBox"></div>
          </div>
          <div class="object solid floor"></div>
          <div class="arrival-marker arrival-1" id="arrival-from-1"></div>
          <div class="arrival-marker arrival-2" id="arrival-from-2"></div>
          <div class="arrival-marker arrival-3" id="arrival-from-5"></div>
          <div class="arrival-marker arrival-4" id="arrival-from-14"></div>
          <div
            class="door object interactable clickable exit-1"
            onclick="location.href = '../room-1-space-port/#arrival-from-3'"
          ></div>
          <div
            class="door object interactable clickable exit-2"
            onclick="location.href = '../room-2-observatory/#arrival-from-3'"
          ></div>
          <div
            class="door object interactable clickable exit-3"
            onclick="
              location.href = '../room-5-dolphin-island-port/#arrival-from-3'
            "
          ></div>
          <div
            class="door object interactable clickable exit-4"
            onclick="
              location.href = '../room-14-giant-robot-harbor/#arrival-from-3'
            "
          ></div>
        </div>
      </div>
    </div>
  </body>
</html>
