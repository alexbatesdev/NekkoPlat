<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planet Piinro - Space Station</title>
    <link rel="stylesheet" href="../../../css/reset.css">
    <link rel="stylesheet" href="../../../css/global.css">
    <link rel="stylesheet" href="../planet-piinro.css">
        <link rel="stylesheet" href="./room-0-space-station.css" />
    <script type="module" src="../../../js/platformer.js" defer></script>
</head>
<body class="planet-piinro room-0">
    <div id="viewport"><div class="level grid-1x1 contain" id="level-one"><div class="screen">
        <div class="room-number">Room 0</div><h1 class="room-title">Space Station</h1>
        <div id="player" style="width: 50px; height: 50px; background: hotpink;"><div class="interaction-indicator question-indicator">?</div><div id="interactionBox"></div><span class="config"><span class="maxVelocity">10</span><span class="sprintMaxVelocity">18</span><span class="acceleration">1</span><span class="sprintAcceleration">2</span><span class="maxAirJumps">1</span><span class="gravity">0.9</span><span class="fallingGravity">3</span><span class="preJumpAllowance">10</span><span class="jumpForce">25</span><span class="coyoteTime">100</span></span></div>
        <div class="object solid floor"></div>
        <div class="arrival-marker arrival-1" id="arrival-from-1"></div><div class="arrival-marker arrival-2" id="arrival-from-4" data-one-way-arrival></div>
        <div class="door object interactable clickable exit-1" id="door-to-1" title="Space Port" onclick="window.location.href='../room-1-space-port/#arrival-from-0'"></div>
    </div></div></div>
</body>
</html>
