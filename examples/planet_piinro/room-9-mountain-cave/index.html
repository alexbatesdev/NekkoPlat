<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planet Piinro - Mountain Cave</title>
    <link rel="stylesheet" href="../../../css/reset.css" />
    <link rel="stylesheet" href="../../../css/global.css" />
    <link rel="stylesheet" href="../planet-piinro.css" />
      <link rel="stylesheet" href="./room-9-mountain-cave.css" />
    <script type="module" src="../../../js/platformer.js" defer></script>
  </head>
  <body>
    <div id="viewport">
      <div class="level grid-1x1 contain" id="level-one">
        <div class="screen">
          <div class="room-number">Room 9</div>
          <h1 class="room-title">Mountain Cave</h1>
          <div
            id="player"
            style="width: 50px; height: 50px; background: hotpink"
          >
            <div class="interaction-indicator question-indicator">?</div>
            <div id="interactionBox"></div>
          </div>
          <div class="object solid floor"></div>
          <div
            id="arrival-from-8"
            class="door object interactable clickable exit-1"
            title="Mountain Base"
            onclick="
              location.href = '../room-8-mountain-base/#arrival-from-9'
            "
          ></div>
          <div
            id="arrival-from-10"
            class="door object interactable clickable exit-2"
            title="Mountain Peak"
            onclick="
              location.href = '../room-10-mountain-peak/#arrival-from-9'
            "
          ></div>
          <div
            id="arrival-from-15"
            class="door object interactable clickable exit-3"
            title="Secret Gulf"
            onclick="
              location.href = '../room-15-secret-gulf/#arrival-from-9'
            "
          ></div>
          <div
            id="arrival-from-11"
            class="door object interactable clickable exit-4"
            title="Fungi Forest"
            onclick="
              location.href = '../room-11-fungi-forest/#arrival-from-9'
            "
          ></div>
        </div>
      </div>
    </div>
  </body>
</html>
