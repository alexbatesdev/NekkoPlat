<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planet Piinro - Space Port</title>
    <link rel="stylesheet" href="../../../css/reset.css" />
    <link rel="stylesheet" href="../../../css/global.css" />
    <link rel="stylesheet" href="../planet-piinro.css" />
      <link rel="stylesheet" href="./room-1-space-port.css" />
    <script type="module" src="../../../js/platformer.js" defer></script>
  </head>
  <body>
    <div id="viewport">
      <div class="level grid-1x1 contain" id="level-one">
        <div class="screen">
          <div class="room-number">Room 1</div>
          <h1 class="room-title">Space Port</h1>
          <div
            id="player"
            style="width: 50px; height: 50px; background: hotpink"
          >
            <div class="interaction-indicator question-indicator">?</div>
            <div id="interactionBox"></div>
          </div>
          <div class="object solid floor"></div>
          <div
            id="arrival-from-0"
            class="door object interactable clickable exit-1"
            title="Space Station"
            onclick="
              location.href = '../room-0-space-station/#arrival-from-1'
            "
          ></div>
          <div
            id="arrival-from-2"
            class="door object interactable clickable exit-2"
            title="Observatory"
            onclick="location.href = '../room-2-observatory/#arrival-from-1'"
          ></div>
          <div
            id="arrival-from-4"
            class="door object interactable clickable exit-3"
            title="Crash Site"
            onclick="
              location.href = '../room-4-crash-site/#arrival-from-1'
            "
          ></div>
        </div>
      </div>
    </div>
  </body>
</html>
