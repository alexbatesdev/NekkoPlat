<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planet Piinro - Halloween Hills</title>
    <link rel="stylesheet" href="../../css/reset.css" />
    <link rel="stylesheet" href="../../css/global.css" />
    <link rel="stylesheet" href="./planet-piinro.css" />
    <script type="module" src="../../js/platformer.js" defer></script>
  </head>
  <body>
    <div id="viewport">
      <div class="level grid-1x1 contain" id="level-one">
        <div class="screen">
          <div class="room-number">Room 12</div>
          <h1 class="room-title">Halloween Hills</h1>
          <div
            id="player"
            style="width: 50px; height: 50px; background: hotpink"
          >
            <div class="interaction-indicator question-indicator">?</div>
            <div id="interactionBox"></div>
          </div>
          <div class="object solid floor"></div>
          <div class="arrival-marker arrival-1" id="arrival-from-11"></div>
          <div class="arrival-marker arrival-2" id="arrival-from-13"></div>
          <div
            class="door object interactable clickable exit-1"
            onclick="
              location.href = './room-11-fungi-forest.html#arrival-from-12'
            "
          ></div>
          <div
            class="door object interactable clickable exit-2"
            onclick="
              location.href = './room-13-giant-robot-city.html#arrival-from-12'
            "
          ></div>
        </div>
      </div>
    </div>
  </body>
</html>
