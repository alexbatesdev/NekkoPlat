<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planet Piinro - Little Big Beach</title>
    <link rel="stylesheet" href="../../../css/reset.css" />
    <link rel="stylesheet" href="../../../css/global.css" />
    <link rel="stylesheet" href="../planet-piinro.css" />
      <link rel="stylesheet" href="./room-7-little-big-beach.css" />
    <script type="module" src="../../../js/platformer.js" defer></script>
  </head>
  <body>
    <div id="viewport">
      <div class="level grid-1x1 contain" id="level-one">
        <div class="screen">
          <div class="room-number">Room 7</div>
          <h1 class="room-title">Little Big Beach</h1>
          <div
            id="player"
            style="width: 50px; height: 50px; background: hotpink"
          >
            <div class="interaction-indicator question-indicator">?</div>
            <div id="interactionBox"></div>
          </div>
          <div class="object solid floor"></div>
          <div
            id="arrival-from-5"
            class="door object interactable clickable exit-1"
            title="Dolphin Island Port"
            onclick="
              location.href = '../room-5-dolphin-island-port/#arrival-from-7'
            "
          ></div>
          <div
            id="arrival-from-6"
            class="door object interactable clickable exit-2"
            title="Little Big City"
            onclick="
              location.href = '../room-6-little-big-city/#arrival-from-7'
            "
          ></div>
          <div
            id="arrival-from-8"
            class="door object interactable clickable exit-3"
            title="Mountain Base"
            onclick="
              location.href = '../room-8-mountain-base/#arrival-from-7'
            "
          ></div>
        </div>
      </div>
    </div>
  </body>
</html>
